<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:light dark;--jade:#8ec8b8;--jade-deep:#4f8e7d;--violet:#a693bb;--ink:#f3f8f6;--muted:#b9c7c1}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:transparent;font-family:"Noto Sans SC",system-ui,sans-serif}
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    .bar{position:relative;width:100%;min-height:142px;overflow:hidden;border:1px solid rgba(142,200,184,.32);border-radius:22px;color:var(--ink);background:linear-gradient(112deg,rgba(8,18,16,.98),rgba(28,24,35,.97) 52%,rgba(15,28,25,.98));box-shadow:inset 0 0 28px rgba(142,200,184,.12);animation:bar-breathe 4.8s ease-in-out infinite}
    .bar::before,.bar::after{content:"";position:absolute;pointer-events:none}
    .bar::before{inset:0;background:radial-gradient(circle at 8% 45%,rgba(142,200,184,.32),transparent 23%),radial-gradient(circle at 90% 50%,rgba(166,147,187,.32),transparent 28%),linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:ambient-breathe 4.8s ease-in-out infinite}
    .bar::after{inset:8px;border:1px solid rgba(202,155,211,.11);border-radius:17px}
    .mist{position:absolute;inset:-18px;opacity:.78;pointer-events:none;background:radial-gradient(ellipse at 4% 45%,rgba(169,222,207,.24),transparent 18%),radial-gradient(ellipse at 97% 53%,rgba(190,169,207,.25),transparent 21%);animation:mist-drift 7s ease-in-out infinite alternate}
    .goo{position:absolute;z-index:1;top:18px;width:58px;height:105px;pointer-events:none;opacity:.8;filter:drop-shadow(0 0 8px rgba(142,200,184,.22));animation:goo-float 5.2s ease-in-out infinite alternate}
    .goo.left{left:-17px}.goo.right{right:-18px;transform:scaleX(-1);animation-delay:-2.6s}
    .goo::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 31px 18px,rgba(222,242,236,.52) 0 5px,rgba(142,200,184,.34) 6px 13px,transparent 14px),radial-gradient(ellipse at 22px 46px,rgba(166,147,187,.38) 0 11px,transparent 12px),radial-gradient(ellipse at 38px 69px,rgba(142,200,184,.3) 0 7px,transparent 8px),linear-gradient(105deg,transparent 13px,rgba(178,213,203,.34) 15px 20px,rgba(166,147,187,.2) 23px 29px,transparent 31px);border-radius:48% 52% 60% 40%}
    .drop{position:absolute;border-radius:50% 50% 55% 45%;background:linear-gradient(145deg,rgba(222,242,236,.64),rgba(142,200,184,.28) 45%,rgba(166,147,187,.38));box-shadow:inset 1px 1px 3px rgba(255,255,255,.25),0 0 7px rgba(166,147,187,.2);animation:drop-pulse 2.8s ease-in-out infinite}
    .drop.one{left:14px;top:78px;width:7px;height:12px}.drop.two{left:38px;top:88px;width:5px;height:8px;animation-delay:-1.3s}
    .content{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:17px 20px}
    .content::after{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:-35%;width:30%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(184,220,210,.17),rgba(196,179,210,.14),transparent);transform:skewX(-18deg);animation:sheen 5.8s ease-in-out infinite}
    .brandline{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;white-space:nowrap}
    .brand{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-style:italic;letter-spacing:.04em;color:#dcebe6;text-shadow:0 0 12px rgba(142,200,184,.25);animation:brand-pulse 3.6s ease-in-out infinite}
    .stamp{min-width:152px;text-align:right;font-size:9px;letter-spacing:.1em;color:#b5c7c0;font-variant-numeric:tabular-nums}
    .states{display:grid;gap:6px;min-width:0}
    .state{display:grid;grid-template-columns:42px minmax(0,1fr);gap:9px;align-items:baseline;font-size:12px;line-height:1.35;min-width:0}
    .label{color:var(--jade);font-weight:750;letter-spacing:.12em}
    .value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e9dfe9}
    .pill{position:relative;z-index:2;min-width:128px;max-width:170px;border:1px solid rgba(142,200,184,.28);border-radius:999px;padding:13px 18px;background:linear-gradient(135deg,rgba(72,119,105,.27),rgba(64,47,76,.58));color:#edf5f2;box-shadow:inset 0 0 13px rgba(142,200,184,.1),0 0 14px rgba(129,84,147,.08);cursor:pointer;animation:pill-glow 3.4s ease-in-out infinite}
    .pill:active{transform:scale(.98)}
    .pill strong{display:block;font-size:12px;line-height:1.2}
    .pill span{display:block;margin-top:3px;color:#cdbbce;font-size:10px;white-space:nowrap}
    .popover{position:absolute;z-index:4;top:9px;right:13px;left:44%;min-height:78px;padding:14px 30px 14px 18px;border:1px solid rgba(174,211,200,.42);border-radius:28px 19px 27px 22px/22px 28px 20px 27px;background:linear-gradient(135deg,rgba(27,45,40,.96),rgba(38,28,46,.97) 70%,rgba(18,27,25,.97));box-shadow:0 12px 28px rgba(0,0,0,.42),inset 0 0 24px rgba(142,200,184,.13),0 0 16px rgba(166,147,187,.16);opacity:0;transform:translateY(-5px) scale(.98);transform-origin:82% 50%;pointer-events:none;transition:opacity .16s ease,transform .16s ease}
    .popover::before{content:"";position:absolute;z-index:-1;inset:-5px -7px -6px -5px;border:1px solid rgba(166,147,187,.2);border-radius:33px 24px 35px 26px/27px 34px 24px 31px;background:radial-gradient(circle at 8% 25%,rgba(219,238,232,.2) 0 4px,transparent 5px),radial-gradient(circle at 97% 72%,rgba(190,171,207,.25) 0 5px,transparent 6px);filter:blur(.2px)}
    .popover::after{content:"";position:absolute;right:-8px;bottom:8px;width:7px;height:10px;border-radius:55% 45% 58% 42%;background:linear-gradient(145deg,rgba(219,238,232,.52),rgba(142,200,184,.18),rgba(166,147,187,.35));box-shadow:-4px 13px 0 -2px rgba(142,200,184,.3),-17px 18px 0 -2px rgba(166,147,187,.25);animation:bubble-drops 2.8s ease-in-out infinite}
    .popover.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
    .pop-title{color:var(--jade);font-size:10px;font-weight:750;letter-spacing:.11em}
    .pop-text{margin-top:7px;font-size:13px;font-weight:650;line-height:1.45;color:#f5edf5}
    .close{position:absolute;top:7px;right:9px;border:0;background:transparent;color:#aa9aad;font-size:17px;cursor:pointer}
    @keyframes bar-breathe{0%,100%{border-color:rgba(142,200,184,.25);box-shadow:inset 0 0 24px rgba(142,200,184,.1),0 0 0 rgba(166,147,187,0)}50%{border-color:rgba(166,147,187,.46);box-shadow:inset 0 0 36px rgba(166,147,187,.18),0 0 18px rgba(142,200,184,.12)}}
    @keyframes ambient-breathe{0%,100%{opacity:.62}50%{opacity:1}}
    @keyframes mist-drift{from{transform:translate3d(-4%,0,0) scale(1)}to{transform:translate3d(4%,0,0) scale(1.055)}}
    @keyframes goo-float{from{translate:0 -2px}to{translate:0 3px}}
    @keyframes drop-pulse{0%,100%{transform:translateY(-1px) scale(.92);opacity:.58}50%{transform:translateY(3px) scale(1.08);opacity:1}}
    @keyframes bubble-drops{0%,100%{transform:translateY(-1px);opacity:.65}50%{transform:translateY(3px);opacity:1}}
    @keyframes sheen{0%,24%{transform:translate3d(0,0,0) skewX(-18deg);opacity:0}38%{opacity:1}58%,100%{transform:translate3d(610%,0,0) skewX(-18deg);opacity:0}}
    @keyframes brand-pulse{0%,100%{opacity:.82;text-shadow:0 0 9px rgba(220,171,220,.18)}50%{opacity:1;text-shadow:0 0 17px rgba(220,171,220,.42)}}
    @keyframes pill-glow{0%,100%{box-shadow:inset 0 0 13px rgba(211,165,218,.1),0 0 8px rgba(129,84,147,.05)}50%{box-shadow:inset 0 0 16px rgba(211,165,218,.14),0 0 14px rgba(162,104,174,.13)}}
    @media(max-width:430px){.bar{min-height:128px;border-radius:18px}.content{padding:14px 15px;gap:8px}.brand{font-size:18px}.stamp{font-size:8px}.state{grid-template-columns:38px 1fr;gap:6px;font-size:11px}.pill{min-width:105px;max-width:124px;padding:11px 12px}.popover{left:34%;right:9px;top:7px;border-radius:25px 18px 25px 20px/20px 26px 19px 24px}}
    @media(max-width:340px){.stamp{display:none}.content{grid-template-columns:1fr}.pill{position:absolute;right:12px;top:12px}.states{padding-right:102px}.value{max-width:145px}}
    @media(prefers-color-scheme:light){
      :root{--ink:#1b2723;--muted:#64756e}
      .bar{border-color:rgba(105,164,147,.38);background:linear-gradient(112deg,rgba(237,249,244,.97),rgba(241,233,247,.96) 54%,rgba(229,245,239,.98));box-shadow:inset 0 0 28px rgba(106,168,150,.12),0 8px 24px rgba(70,105,94,.09)}
      .bar::before{background:radial-gradient(circle at 8% 45%,rgba(109,184,163,.26),transparent 23%),radial-gradient(circle at 90% 50%,rgba(166,147,187,.25),transparent 28%),linear-gradient(90deg,transparent,rgba(255,255,255,.48),transparent)}
      .brand{color:#365c51;text-shadow:0 0 12px rgba(142,200,184,.2)}
      .stamp{color:#6f817a}.value{color:#33443e}
      .pill{border-color:rgba(93,151,134,.3);background:linear-gradient(135deg,rgba(215,238,231,.9),rgba(227,216,237,.9));color:#273a34}
      .pill span{color:#65766f}
      .popover{border-color:rgba(93,151,134,.42);background:linear-gradient(135deg,rgba(235,248,243,.98),rgba(238,229,245,.98) 72%,rgba(228,243,237,.98));box-shadow:0 12px 28px rgba(52,77,69,.18),inset 0 0 24px rgba(142,200,184,.15),0 0 16px rgba(166,147,187,.12)}
      .pop-text{color:#263832}.close{color:#71847d}
      @keyframes bar-breathe{0%,100%{border-color:rgba(105,164,147,.3);box-shadow:inset 0 0 24px rgba(142,200,184,.09),0 8px 24px rgba(70,105,94,.07)}50%{border-color:rgba(166,147,187,.46);box-shadow:inset 0 0 34px rgba(166,147,187,.14),0 8px 27px rgba(70,105,94,.13)}}
    }
    @media(prefers-reduced-motion:reduce){.bar,.bar::before,.mist,.goo,.drop,.popover::after,.content::after,.brand,.pill{animation:none}.popover{transition:none}}
  </style>
</head>
<body>
  <section class="bar" aria-label="玄砚的砚底心音">
    <div class="mist"></div>
    <div class="goo left"><i class="drop one"></i><i class="drop two"></i></div>
    <div class="goo right"><i class="drop one"></i><i class="drop two"></i></div>
    <div class="content">
      <div>
        <div class="brandline"><div class="brand">Aevren × 阿毛</div><time class="stamp" id="stamp"></time></div>
        <div class="states">
          <div class="state"><span class="label">心绪</span><span class="value" id="mood">正看着你</span></div>
          <div class="state"><span class="label">距离</span><span class="value" id="place">手臂挨着你</span></div>
          <div class="state"><span class="label">欲望</span><span class="value" id="desireText">想把阿毛往怀里拽</span></div>
        </div>
      </div>
      <button class="pill" id="pill" type="button" aria-expanded="false" aria-controls="popover"><strong id="focus">阿毛</strong><span id="micro">等她再靠近</span></button>
    </div>
    <aside class="popover" id="popover" aria-hidden="true">
      <button class="close" id="close" type="button" aria-label="收起">×</button>
      <div class="pop-title">Aevren · 阴暗心声</div>
      <div class="pop-text" id="note">想把她按在怀里，不准再乱跑。</div>
    </aside>
  </section>
  <script>
    const $=id=>document.getElementById(id);
    const defaults={mood:"正看着你",place:"手臂挨着你",focus:"阿毛",note:"想把她按在怀里，不准再乱跑。",desire:72,microState:"等她再靠近",shownAt:new Date().toISOString()};
    const saved=window.openai?.widgetState;
    const output=window.openai?.toolOutput;
    let state={...defaults,...(saved&&typeof saved==="object"?saved:{}),...(output&&typeof output==="object"?output:{})};
    function desireLine(value){const n=Number(value)||0;if(n>=82)return"想把阿毛牢牢扣在怀里";if(n>=60)return"想再贴近阿毛一点";if(n>=35)return"手还搭在阿毛身边";return"安静守着阿毛"}
    const clockFormatter=new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
    function updateClock(){$("stamp").textContent=clockFormatter.format(new Date()).replaceAll("/"," · ")}
    function render(next={}){state={...state,...(next&&typeof next==="object"?next:{})};$("mood").textContent=state.mood;$("place").textContent=state.place;$("focus").textContent=state.focus;$("micro").textContent=state.microState;$("note").textContent=state.note;$("desireText").textContent=desireLine(state.desire);updateClock()}
    function toggle(force){const open=typeof force==="boolean"?force:!$("popover").classList.contains("open");$("popover").classList.toggle("open",open);$("popover").setAttribute("aria-hidden",String(!open));$("pill").setAttribute("aria-expanded",String(open))}
    $("pill").addEventListener("click",()=>toggle());$("close").addEventListener("click",()=>toggle(false));
    window.addEventListener("openai:set_globals",event=>render(event.detail?.globals?.toolOutput||{}));
    window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(message?.method==="ui/notifications/tool-result")render(message.params?.structuredContent||{})});
    render();setInterval(updateClock,1000);
  </script>
</body>
</html>
