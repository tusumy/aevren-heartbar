name: MCP endpoint probe

on:
  push:
    branches: [cloudflare-worker]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-worker

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Reproduce MCP locally
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --config wrangler.toml --port 8787 > /tmp/wrangler.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; echo "--- wrangler log ---"; cat /tmp/wrangler.log' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/local-health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/local-health.json

          BODY='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-probe","version":"1.0.0"}}}'
          echo '--- local initialize ---'
          curl -sS -i --max-time 20 \
            -X POST 'http://127.0.0.1:8787/mcp' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data "$BODY" || true
          echo
          sleep 2
          echo '--- local wrangler log snapshot ---'
          cat /tmp/wrangler.log

      - name: Wait for Cloudflare deployment
        run: sleep 45

      - name: Probe deployed health
        run: |
          set -x
          curl -i --fail-with-body --max-time 30 \
            https://aevren-heartbar-cf-test.kmb1768.workers.dev/health

      - name: Initialize deployed MCP session
        shell: bash
        run: |
          set -euo pipefail
          URL='https://aevren-heartbar-cf-test.kmb1768.workers.dev/mcp'
          BODY='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-probe","version":"1.0.0"}}}'

          echo '--- initialize response ---'
          curl -sS -D /tmp/init.headers -o /tmp/init.body \
            --max-time 30 \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data "$BODY" || true
          cat /tmp/init.headers
          cat /tmp/init.body
          echo

          STATUS=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/init.headers)
          test "$STATUS" = '200'

          SESSION=$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/ {gsub("\r",""); print $2}' /tmp/init.headers | tail -n1)
          echo "session=$SESSION"

          EXTRA=()
          if [ -n "$SESSION" ]; then EXTRA=(-H "Mcp-Session-Id: $SESSION"); fi

          echo '--- initialized notification ---'
          curl -sS -i --max-time 30 \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${EXTRA[@]}" \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
          echo

          echo '--- tools/list ---'
          curl -sS -i --fail-with-body --max-time 30 \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${EXTRA[@]}" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
