name = "aevren-heartbar"
main = "src/index.js"
compatibility_date = "2026-09-27"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "HeartbarMCP"
class_name = "HeartbarMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HeartbarMCP"]
